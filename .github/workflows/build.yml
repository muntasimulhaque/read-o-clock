name: Build signed Android release

on:
  push:
    branches: [main]
    # Only rebuild when something that affects the app actually changes, so
    # doc-only commits (README, play-store assets) don't burn a build.
    paths:
      - "app/**"
      - "core/**"
      - "tools/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only at workflow level; the publish step below needs write only when
# a signed build exists.
permissions:
  contents: read

concurrency:
  group: build-main
  # Never cancel a run that may already be publishing the release.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4.4.3

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4.4.3

      - name: Run unit tests, lint and asset pins
        # The rules are pure JVM tests, full lint catches what tests cannot,
        # and :tools:checkIcons pins the committed launcher icon bytes.
        run: ./gradlew :core:test :app:testReleaseUnitTest :app:lintRelease :tools:checkIcons

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Decode signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KEYSTORE_BASE64 is not set; building an unsigned release and not publishing it."
          else
            echo "$KEYSTORE_BASE64" | base64 -d > app/signing.keystore
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # The only build that ever reaches Google Play is minified and
      # resource-shrunk. Building it here means R8 is exercised on every
      # change, instead of for the first time on the day of a release.
      - name: Build release AAB and APK
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.present == 'true' && 'signing.keystore' || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease :app:assembleRelease

      - name: Verify signing certificate
        if: steps.keystore.outputs.present == 'true'
        run: keytool -printcert -jarfile app/build/outputs/bundle/release/app-release.aab | grep -A2 "SHA256"

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: read-o-clock-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: read-o-clock-release-apk
          path: app/build/outputs/apk/release/app-release*.apk
          retention-days: 30

      - name: Upload release AAB
        if: steps.keystore.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: read-o-clock-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Publish the signed build to the latest-build release
        if: steps.keystore.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build \
            app/build/outputs/bundle/release/app-release.aab \
            app/build/outputs/apk/release/app-release.apk \
            --title "Latest CI build" \
            --notes "Automated signed build of commit ${GITHUB_SHA}" \
            --prerelease
